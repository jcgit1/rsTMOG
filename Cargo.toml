[workspace]
members = ["crates/tmog-core"]
resolver = "3"

[package]
name = "rstmog"
version = "0.2.0"
edition = "2024"
description = "rsTMOG — Task Manager OG, rewritten in Rust (Linux)"
license = "MIT"
repository = "https://github.com/jcgit1/rsTMOG"

[dependencies]
# GUI: immediate-mode, no system GUI deps (pure-Rust winit + wgpu backend)
egui = "0.33"
# NOTE: eframe's "x11"/"wayland" features must be enabled explicitly — they are not in
# the default set, and without them winit compiles with no platform backend at all.
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
# eframe pins wgpu with default-features=false (std only), so the native GPU backends
# must be switched on here (vulkan for the RTX 3060, gles as fallback).
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles"] }

# Icons: window/tray icon from assets/icons (package README guidance)
image = { version = "0.25", default-features = false, features = ["png"] }
dark-light = "2"
# System tray (GTK/libappindicator on Linux only). libxdo (accelerators)
# is off: the tray menu here uses none and the lib isn't installed on this
# box. On Windows tray-icon uses Shell_NotifyIcon — no extra deps.
tray-icon = { version = "0.20", default-features = false }

# Support
anyhow = "1"
crossbeam-channel = "0.5"
thiserror = "2"
tmog-core = { path = "crates/tmog-core" }

# Linux-only: the GTK tray backend (see traythread).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"

[dev-dependencies]
insta = "1"

[profile.release]
lto = "thin"
strip = true
