# Build the x86_64 AppImage and publish it as a GitHub release when a
# version tag is pushed:
#
#   1. bump `version` in Cargo.toml (e.g. 0.2.1) and merge it to main
#   2. git tag v0.2.1 && git push origin v0.2.1
#
# Ubuntu 22.04 is deliberate: its glibc (2.35) is the floor the AppImage
# promises, and packaging/appimage/package.sh refuses anything newer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the release and upload assets
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "v$version" != "$TAG" ]]; then
            echo "tag $TAG does not match Cargo.toml version v$version" >&2
            exit 1
          fi

      - name: System packages (same set as packaging/appimage/Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config patchelf file \
            libgtk-3-dev libgtk-3-bin libglib2.0-dev libglib2.0-bin \
            libayatana-appindicator3-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev librsvg2-dev gobject-introspection

      - name: Rust toolchain (pinned, same as the Dockerfile)
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      # fmt/clippy are style gates for PRs (scripts/ci.sh); a release only
      # needs the code to be correct
      - name: Tests
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package AppImage (pinned, checksum-verified tools)
        run: bash packaging/appimage/package.sh target/release/rstmog dist

      - name: AppImage runs
        run: |
          out=$(APPIMAGE_EXTRACT_AND_RUN=1 dist/rstmog-*-x86_64.AppImage --version)
          echo "$out"
          [[ "$out" == "rstmog ${TAG#v}" ]]

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            dist/rstmog-*-x86_64.AppImage \
            dist/rstmog-*-x86_64.AppImage.sha256 \
            --verify-tag \
            --title "rsTMOG ${TAG#v}" \
            --generate-notes
