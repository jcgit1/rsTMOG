name: AppImage

# Run by hand with an existing release tag. The AppImage is built from that
# tag's source (not from whichever branch the run was started on) and is
# added to its release. Assets already on the release are never replaced:
# to rebuild, delete the old assets first.
#
# Security layout:
# - The build job has a read-only token, and checkout does not leave it in
#   .git/config, so dependency build scripts cannot push or edit releases.
# - Only the publish job can write, and it runs no project code: it
#   downloads the built files and calls `gh`.
# - Every action is pinned to a full commit SHA; tags and branches can move.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the AppImage to (e.g. v0.2.1)
        required: true

permissions: {}

concurrency:
  group: appimage-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Tag must match Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "v$version" != "$TAG" ]]; then
            echo "tag $TAG does not match Cargo.toml version v$version" >&2
            exit 1
          fi

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            ca-certificates \
            file \
            pkg-config \
            patchelf \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libwayland-dev

      # rustup is preinstalled on the runner; no third-party action needed
      - name: Rust toolchain (same pin as the Dockerfile)
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: bash packaging/appimage/package.sh target/release/rstmog dist

      - name: AppImage runs and reports the tagged version
        run: |
          out=$(APPIMAGE_EXTRACT_AND_RUN=1 dist/rstmog-*-x86_64.AppImage --version)
          echo "$out"
          [[ "$out" == "rstmog ${TAG#v}" ]]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: dist

      - name: Attach to the release (never replaces existing assets)
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag \
              --title "rsTMOG ${TAG#v}" --generate-notes
          fi
          # no --clobber: an asset with the same name makes this fail
          gh release upload "$TAG" dist/*
