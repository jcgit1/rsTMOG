name: AppImage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the AppImage to
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            ca-certificates \
            file \
            pkg-config \
            patchelf \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libwayland-dev

      - uses: dtolnay/rust-toolchain@1.99.1

      - name: Build
        run: |
          if [[ -f Cargo.lock ]]; then
            cargo build --release --locked
          else
            cargo build --release
          fi

      - name: Package
        run: bash packaging/appimage/package.sh target/release/rstmog packaging/appimage/dist

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: packaging/appimage/dist/*
          fail_on_unmatched_files: true
