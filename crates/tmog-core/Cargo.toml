[package]
name = "tmog-core"
version = "0.1.0"
edition = "2024"
description = "rsTMOG metrics core: /proc, /sys, NVML collectors — zero GUI deps"
license = "MIT"

[dependencies]
nvml-wrapper = { version = "0.11", features = ["legacy-functions"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
